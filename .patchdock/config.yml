# Generated by `dock init`.

# Names the agent image built for this project, so subsequent runs reuse the
# same container instead of rebuilding. Lowercase letters and digits, separated
# by '.', '_' or '-'.
name_space: patchdock

# Per-container limits. Each pipeline stage runs in its own container and is
# governed by these.
container:
  # Wall-clock ceiling for a single container. When it elapses the container is
  # killed and the stage fails. Accepts Go duration strings: "90s", "10m", "1h".
  # Set to 0 for no wall-clock limit.
  timeout: 10m

  # Maximum tokens a single container may spend. Set to 0 for no token limit.
  token_budget: 100000

# How many times the executor may be re-run after the reviewer rejects, before
# the run gives up. 0 means a single attempt with no retry. Every retry is
# another full executor + reviewer round, so this multiplies what a run costs
retries:
  max: 1

# Host files mounted read-only into every stage container, so the agent can
# authenticate.
credentials:
  - host: ~/.codex/auth.json
    target: /codex-auth/auth.json
    env:
      CODEX_HOME: /codex-auth

# Which filepath drives each stage.
#
# Currently pointed at the mock agents in mock/, which sleep and return canned
# output instead of calling a model. Swap back to planner.ts / executor.ts /
# reviewer.ts to use Codex again.
stages:
  planner: mock/planner.ts
  executor: mock/executor.ts
  reviewer: mock/reviewer.ts
