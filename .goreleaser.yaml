# Documentation at https://goreleaser.com
version: 2

project_name: patchdock

before:
  hooks:
    - go mod tidy

builds:
  - id: dock
    main: ./cmd/dock
    binary: dock
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

homebrew_casks:
  - name: patchdock
    repository:
      owner: HJyup
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/HJyup/patchdock
    description: Run coding agents in parallel Docker containers from your terminal
    license: MIT
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    # The release binaries are unsigned, so macOS would quarantine them.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dock"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
